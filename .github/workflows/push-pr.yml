on:
    push:
        branches:
            - main
            - "release/**"
        paths: 
            - "src/**"
    pull_request:
        branches: 
            - main
            - "release/**"
jobs:
    test:
        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@v4.2.2

        - name: set up node js
          uses: actions/setup-node@v4
          with:
            node-version: 20

        - name: install dependencies
          run: npm ci

        - name: run tests
          run: npm test
